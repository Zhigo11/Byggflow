<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a1d">
  <title>ByggFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#061a1d;--panel:#0d262b;--panel2:#102f35;--text:#f4f7f8;--muted:#9ba8ac;--line:#294a51;--accent:#ffc23d;--danger:#ff6b6b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:82px}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(6,26,29,.96);border-bottom:1px solid var(--line);padding:18px}
    .brand{font-weight:900;font-size:28px}.brand span{color:var(--accent)}.subtitle,.small,p{color:var(--muted)}
    .wrap{max-width:820px;margin:auto;padding:22px 18px}h1{font-size:32px;margin:18px 0 7px}h2{font-size:22px;margin:0 0 12px}h3{margin:0 0 8px}
    .card,.item,.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px}.card{margin-bottom:14px}.list{display:flex;flex-direction:column;gap:10px}
    label{display:block;color:var(--muted);font-size:13px;margin:11px 0 6px}input,textarea,select{width:100%;background:#061d21;color:var(--text);border:1px solid #2a4d54;border-radius:13px;padding:13px 14px}
    textarea{min-height:100px}.primary,.secondary{border-radius:13px;padding:13px 15px;font-weight:900}.primary{width:100%;border:0;background:var(--accent);color:#241600;margin-top:13px}.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}
    .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .stat strong{display:block;font-size:25px;margin-top:6px}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}
    .screen{display:none}.screen.active{display:block}.error{color:var(--danger)}.project-link{cursor:pointer}.back{margin-bottom:12px}.empty{color:var(--muted);padding:12px 0}
    .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#08191d;border-top:1px solid var(--line)}.bottomnav-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
    .navbtn{background:transparent;border:0;color:#bdc8cb;padding:10px 2px 12px;font-size:11px;font-weight:800}.navbtn .ico{display:block;font-size:22px;margin-bottom:4px}.navbtn.active{color:var(--accent)}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<header class="topbar"><div class="brand">BYGG<span>FLOW</span></div><div class="subtitle">Steg 4 • riktig inloggning och molndata</div></header>
<main class="wrap">
<section id="loginView"><h1>Välkommen</h1><p>Logga in med ditt ByggFlow-konto.</p><div class="card"><form id="loginForm">
<label>E-post</label><input id="email" type="email" required><label>Lösenord</label><input id="password" type="password" minlength="6" required>
<button class="primary" type="submit">LOGGA IN</button><button class="secondary" type="button" id="signupBtn" style="width:100%;margin-top:9px">SKAPA KONTO</button>
<p id="loginMsg" class="small">Första gången kan du behöva bekräfta din e-post.</p></form></div></section>

<section id="appView" class="hidden">
<section id="home" class="screen active"><h1>Översikt</h1><p>Data hämtas från ByggFlow-molnet.</p><div class="grid">
<div class="stat"><span class="small">Projekt</span><strong id="statProjects">0</strong></div><div class="stat"><span class="small">Öppna uppgifter</span><strong id="statTasks">0</strong></div>
<div class="stat"><span class="small">Timmar</span><strong id="statHours">0</strong></div><div class="stat"><span class="small">Bilder</span><strong>0</strong></div></div>
<div class="section-title"><h2>Senaste projekt</h2><button class="secondary" id="refreshBtn">↻ Synka</button></div><div id="homeProjects" class="list"></div></section>

<section id="projects" class="screen"><div class="section-title"><h1>Projekt</h1><button class="secondary" id="newProjectBtn">+ Nytt</button></div>
<div id="projectForm" class="card hidden"><label>Projektnamn</label><input id="projectName"><label>Adress</label><input id="projectAddress"><label>Kund</label><input id="projectCustomer"><label>Telefon</label><input id="projectPhone"><button class="primary" id="saveProjectBtn">Spara projekt</button></div><div id="projectList" class="list"></div></section>

<section id="projectDetail" class="screen"><button class="secondary back" id="backProjectsBtn">← Tillbaka</button><div id="projectDetailContent"></div></section>

<section id="tasks" class="screen"><div class="section-title"><h1>Uppgifter</h1><button class="secondary" id="newTaskBtn">+ Ny</button></div>
<div id="taskForm" class="card hidden"><label>Uppgift</label><input id="taskTitle"><label>Projekt</label><select id="taskProject"></select><label>Ansvarig</label><input id="taskOwner"><button class="primary" id="saveTaskBtn">Spara uppgift</button></div><div id="taskList" class="list"></div></section>

<section id="logs" class="screen"><div class="section-title"><h1>Dagbok</h1><button class="secondary" id="newLogBtn">+ Nytt</button></div>
<div id="logForm" class="card hidden"><label>Projekt</label><select id="logProject"></select><label>Vad har gjorts?</label><textarea id="logText"></textarea><button class="primary" id="saveLogBtn">Spara inlägg</button></div><div id="logList" class="list"></div></section>

<section id="more" class="screen"><h1>Mer</h1><div class="card"><h2>Tidrapportering</h2><label>Projekt</label><select id="timeProject"></select>
<div class="row"><div><label>Datum</label><input id="timeDate" type="date"></div><div><label>Timmar</label><input id="timeHours" type="number" min="0" step="0.25"></div></div>
<label>Person</label><input id="timePerson"><label>Kommentar</label><input id="timeNote"><button class="primary" id="saveTimeBtn">Spara tid</button></div><div id="timeList" class="list"></div>
<div class="card" style="margin-top:16px"><p id="userEmail" class="small"></p><button class="secondary" id="logoutBtn">Logga ut</button></div></section>
</section>
</main>

<nav id="bottomNav" class="bottomnav hidden"><div class="bottomnav-inner"><button class="navbtn active" data-screen="home"><span class="ico">⌂</span>Hem</button><button class="navbtn" data-screen="projects"><span class="ico">▣</span>Projekt</button><button class="navbtn" data-screen="tasks"><span class="ico">✓</span>Uppgifter</button><button class="navbtn" data-screen="logs"><span class="ico">✎</span>Dagbok</button><button class="navbtn" data-screen="more"><span class="ico">•••</span>Mer</button></div></nav>

<script>
const SUPABASE_URL="https://ctkxxxgvkvzjkcylwzgv.supabase.co";
const SUPABASE_KEY="sb_publishable_aCe9PzzJcdTTLO0pQjspIQ_g3ZBtVBA";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),state={projects:[],tasks:[],logs:[],times:[]};let currentUser=null,currentProjectId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const hours=n=>(Math.round(Number(n||0)*100)/100).toString().replace(".",","),pname=id=>state.projects.find(p=>p.id===id)?.name||"Inget projekt valt";
function showLogin(){loginView.classList.remove("hidden");appView.classList.add("hidden");bottomNav.classList.add("hidden")}
function showApp(){loginView.classList.add("hidden");appView.classList.remove("hidden");bottomNav.classList.remove("hidden");userEmail.textContent=currentUser?.email||"";renderAll()}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.screen===id))}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>screen(b.dataset.screen));

async function sync(){const [p,t,l,ti]=await Promise.all([db.from("projects").select("*").order("created_at",{ascending:false}),db.from("tasks").select("*").order("created_at",{ascending:false}),db.from("diary_entries").select("*").order("created_at",{ascending:false}),db.from("time_entries").select("*").order("created_at",{ascending:false})]);const e=[p.error,t.error,l.error,ti.error].find(Boolean);if(e)return alert("Synkfel: "+e.message);state.projects=p.data||[];state.tasks=t.data||[];state.logs=l.data||[];state.times=ti.data||[];renderAll();if(currentProjectId)renderDetail(currentProjectId)}

loginForm.onsubmit=async e=>{e.preventDefault();loginMsg.textContent="Loggar in...";const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginMsg.textContent="Fel: "+error.message;loginMsg.className="small error";return}currentUser=data.user;await sync();showApp()};
signupBtn.onclick=async()=>{const mail=email.value.trim(),pass=password.value;if(!mail||pass.length<6)return alert("Fyll i e-post och minst 6 tecken.");const {data,error}=await db.auth.signUp({email:mail,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return alert(error.message);if(data.session){currentUser=data.user;await sync();showApp()}else loginMsg.textContent="Kontot är skapat. Bekräfta e-posten och logga sedan in."};

newProjectBtn.onclick=()=>projectForm.classList.toggle("hidden");newTaskBtn.onclick=()=>taskForm.classList.toggle("hidden");newLogBtn.onclick=()=>logForm.classList.toggle("hidden");refreshBtn.onclick=sync;backProjectsBtn.onclick=()=>screen("projects");
saveProjectBtn.onclick=async()=>{const name=projectName.value.trim();if(!name)return alert("Skriv projektnamn.");const {error}=await db.from("projects").insert({name,address:projectAddress.value.trim(),customer:projectCustomer.value.trim(),phone:projectPhone.value.trim()});if(error)return alert(error.message);projectName.value=projectAddress.value=projectCustomer.value=projectPhone.value="";projectForm.classList.add("hidden");await sync()};
saveTaskBtn.onclick=async()=>{if(!taskTitle.value.trim()||!taskProject.value)return alert("Fyll i uppgift och projekt.");const {error}=await db.from("tasks").insert({title:taskTitle.value.trim(),project_id:taskProject.value,assigned_to:taskOwner.value.trim(),done:false});if(error)return alert(error.message);taskTitle.value=taskOwner.value="";taskForm.classList.add("hidden");await sync()};
saveLogBtn.onclick=async()=>{if(!logText.value.trim()||!logProject.value)return alert("Fyll i dagbok och projekt.");const {error}=await db.from("diary_entries").insert({text:logText.value.trim(),project_id:logProject.value});if(error)return alert(error.message);logText.value="";logForm.classList.add("hidden");await sync()};
saveTimeBtn.onclick=async()=>{const h=Number(timeHours.value);if(!timeProject.value||!h)return alert("Välj projekt och timmar.");const {error}=await db.from("time_entries").insert({project_id:timeProject.value,work_date:timeDate.value||new Date().toISOString().slice(0,10),hours:h,person:timePerson.value.trim(),note:timeNote.value.trim()});if(error)return alert(error.message);timeHours.value=timeNote.value="";await sync()};
window.toggleTask=async id=>{const t=state.tasks.find(x=>x.id===id);if(!t)return;const {error}=await db.from("tasks").update({done:!t.done}).eq("id",id);if(error)return alert(error.message);await sync()};
window.openProject=id=>{currentProjectId=id;renderDetail(id);screen("projectDetail")};

function renderDetail(id){const p=state.projects.find(x=>x.id===id);if(!p)return;const tasks=state.tasks.filter(x=>x.project_id===id),logs=state.logs.filter(x=>x.project_id===id),times=state.times.filter(x=>x.project_id===id),total=times.reduce((a,b)=>a+Number(b.hours||0),0);projectDetailContent.innerHTML=`<div class="card"><h1>${esc(p.name)}</h1><p>${esc(p.address||"")}<br><b>Kund:</b> ${esc(p.customer||"-")}<br><b>Telefon:</b> ${esc(p.phone||"-")}</p></div><div class="grid"><div class="stat">Uppgifter<strong>${tasks.length}</strong></div><div class="stat">Klart<strong>${tasks.filter(t=>t.done).length}</strong></div><div class="stat">Timmar<strong>${hours(total)}</strong></div><div class="stat">Bilder<strong>0</strong></div></div><div class="section-title"><h2>Projektets uppgifter</h2></div><div class="list">${tasks.length?tasks.map(t=>`<div class="item"><div class="row"><div><h3>${esc(t.title)}</h3><span class="small">${esc(t.assigned_to||"Ej tilldelad")}</span></div><button class="secondary" onclick="toggleTask('${t.id}')">${t.done?"Ångra":"Klart"}</button></div></div>`).join(""):'<div class="empty">Inga uppgifter.</div>'}</div><div class="section-title"><h2>Dagbok</h2></div><div class="list">${logs.length?logs.map(l=>`<div class="item"><span class="small">${new Date(l.created_at).toLocaleDateString("sv-SE")}</span><p>${esc(l.text)}</p></div>`).join(""):'<div class="empty">Inga inlägg.</div>'}</div>`}

function renderAll(){const opts='<option value="">Välj projekt</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");[taskProject,logProject,timeProject].forEach(x=>x.innerHTML=opts);timeDate.value=timeDate.value||new Date().toISOString().slice(0,10);statProjects.textContent=state.projects.length;statTasks.textContent=state.tasks.filter(t=>!t.done).length;statHours.textContent=hours(state.times.reduce((a,b)=>a+Number(b.hours||0),0));projectList.innerHTML=state.projects.length?state.projects.map(p=>`<div class="item project-link" onclick="openProject('${p.id}')"><h3>${esc(p.name)}</h3><span class="small">${esc(p.address||"")} • ${esc(p.customer||"")}</span><br><span class="badge">Öppna projekt</span></div>`).join(""):'<div class="empty">Inga projekt ännu.</div>';homeProjects.innerHTML=state.projects.length?state.projects.slice(0,3).map(p=>`<div class="item project-link" onclick="openProject('${p.id}')"><h3>${esc(p.name)}</h3><span class="small">${esc(p.address||"")}</span></div>`).join(""):'<div class="empty">Skapa ditt första projekt.</div>';taskList.innerHTML=state.tasks.length?state.tasks.map(t=>`<div class="item"><div class="row"><div><h3>${esc(t.title)}</h3><span class="small">${esc(pname(t.project_id))} • ${esc(t.assigned_to||"")}</span></div><button class="secondary" onclick="toggleTask('${t.id}')">${t.done?"Ångra":"Klart"}</button></div></div>`).join(""):'<div class="empty">Inga uppgifter.</div>';logList.innerHTML=state.logs.length?state.logs.map(l=>`<div class="item"><h3>${esc(pname(l.project_id))}</h3><p>${esc(l.text)}</p></div>`).join(""):'<div class="empty">Inga dagboksinlägg.</div>';timeList.innerHTML=state.times.length?state.times.map(t=>`<div class="item"><h3>${esc(t.person||"Okänd")} • ${hours(t.hours)} h</h3><span class="small">${esc(pname(t.project_id))} • ${esc(t.work_date||"")}</span></div>`).join(""):'<div class="empty">Ingen tid rapporterad.</div>'}
logoutBtn.onclick=async()=>{await db.auth.signOut();currentUser=null;showLogin()};
(async()=>{const {data:{session}}=await db.auth.getSession();if(session?.user){currentUser=session.user;await sync();showApp()}else showLogin()})();
</script>
</body>
</html>
